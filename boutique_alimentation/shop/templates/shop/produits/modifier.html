{% extends 'shop/base.html' %}
{% load static %}

{% block page_title %}Modifier {{ produit.nom }}{% endblock %}

{% block content %}

<div class="card">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="fas fa-edit"></i> Modifier {{ produit.nom }}</h5>
    </div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Nom du produit *</label>
                    <input type="text" name="nom" class="form-control" value="{{ produit.nom }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Unité</label>
                    <select name="unite" class="form-control">
                        <option value="pcs" {% if produit.unite == 'pcs' %}selected{% endif %}>Pièce</option>
                        <option value="kg" {% if produit.unite == 'kg' %}selected{% endif %}>Kilogramme</option>
                        <option value="l" {% if produit.unite == 'l' %}selected{% endif %}>Litre</option>
                        <option value="box" {% if produit.unite == 'box' %}selected{% endif %}>Boîte</option>
                        <option value="pack" {% if produit.unite == 'pack' %}selected{% endif %}>Pack</option>
                        <option value="g" {% if produit.unite == 'g' %}selected{% endif %}>Gramme</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Catégorie</label>
                    <select name="categorie" class="form-control">
                        <option value="">Sélectionner</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if produit.categorie.id == cat.id %}selected{% endif %}>{{ cat.nom }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Fournisseur</label>
                    <select name="fournisseur" class="form-control">
                        <option value="">Sélectionner</option>
                        {% for four in fournisseurs %}
                        <option value="{{ four.id }}" {% if produit.fournisseur.id == four.id %}selected{% endif %}>{{ four.nom }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label>Prix d'achat (FCFA)</label>
                    <input type="number" name="prix_achat" class="form-control" step="0.01" value="{{ produit.prix_achat }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label>Prix de vente (FCFA)</label>
                    <input type="number" name="prix_vente" class="form-control" step="0.01" value="{{ produit.prix_vente }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label>Quantité en stock</label>
                    <input type="number" name="quantite_stock" class="form-control" value="{{ produit.quantite_stock }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label>Stock minimum d'alerte</label>
                    <input type="number" name="stock_min" class="form-control" value="{{ produit.stock_min }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label>Date d'expiration</label>
                    <input type="date" name="date_expiration" class="form-control" value="{{ produit.date_expiration|date:'Y-m-d' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label>SKU (Code unique)</label>
                    <input type="text" name="sku" class="form-control" value="{{ produit.sku }}">
                </div>
                <div class="col-md-12 mb-3">
                    <label>Description</label>
                    <textarea name="description" class="form-control" rows="3">{{ produit.description }}</textarea>
                </div>
                <div class="col-md-12 mb-3">
                    <label>Image actuelle</label>
                    {% if produit.image %}
                    <div class="mb-2">
                        <img src="{{ produit.image.url }}" width="100" height="100" style="object-fit: cover; border-radius: 8px;">
                    </div>
                    {% endif %}
                    <input type="file" name="image" class="form-control" accept="image/*">
                    <small class="text-muted">Laissez vide pour conserver l'image actuelle</small>
                </div>
                <div class="col-md-12 mb-3">
                    <div class="form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" {% if produit.is_active %}checked{% endif %}>
                        <label class="form-check-label">Produit actif (visible dans les ventes)</label>
                    </div>
                </div>
            </div>
            
            <div class="mt-3">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Enregistrer les modifications
                </button>
                <a href="{% url 'liste_produits' %}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Annuler
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
