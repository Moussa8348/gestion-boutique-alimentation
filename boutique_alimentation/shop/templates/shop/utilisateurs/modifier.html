{% extends 'shop/base.html' %}

{% block page_title %}Modifier {{ utilisateur.username }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="fas fa-edit"></i> Modifier {{ utilisateur.username }}</h5>
    </div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Nom d'utilisateur *</label>
                    <input type="text" name="username" class="form-control" value="{{ utilisateur.username }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" value="{{ utilisateur.email }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Mot de passe (laisser vide pour ne pas changer)</label>
                    <input type="password" name="password" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Rôle</label>
                    <select name="role" class="form-control">
                        <option value="manager" {% if utilisateur.profil.role == 'manager' %}selected{% endif %}>📋 Gérant</option>
                        <option value="admin" {% if utilisateur.profil.role == 'admin' %}selected{% endif %}>👑 Administrateur</option>
                        <option value="comptable" {% if utilisateur.profil.role == 'comptable' %}selected{% endif %}>💰 Comptable</option>
                    </select>
                </div>
                <div class="col-md-12 mb-3">
                    <label>Photo de profil</label>
                    {% if utilisateur.profil.avatar %}
                        <div class="mb-2">
                            <img src="{{ utilisateur.profil.avatar.url }}" width="60" height="60" style="border-radius: 50%; object-fit: cover;">
                        </div>
                    {% endif %}
                    <input type="file" name="avatar" class="form-control" accept="image/*">
                    <small class="text-muted">Laissez vide pour conserver l’image actuelle.</small>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a href="{% url 'liste_utilisateurs' %}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
