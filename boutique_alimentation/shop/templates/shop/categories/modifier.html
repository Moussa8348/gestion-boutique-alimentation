{% extends 'shop/base.html' %}

{% block page_title %}Modifier {{ categorie.nom }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">✏️ Modifier {{ categorie.nom }}</h5>
    </div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label>Nom *</label>
                <input type="text" name="nom" class="form-control" value="{{ categorie.nom }}" required>
            </div>
            <div class="mb-3">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="3">{{ categorie.description }}</textarea>
            </div>
            <div class="mb-3">
                <label>Image actuelle</label><br>
                {% if categorie.image %}
                    <img src="{{ categorie.image.url }}" width="80" class="mb-2"><br>
                {% endif %}
                <input type="file" name="image" class="form-control" accept="image/*">
                <small class="text-muted">Laissez vide pour conserver l'image actuelle.</small>
            </div>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a href="{% url 'liste_categories' %}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
