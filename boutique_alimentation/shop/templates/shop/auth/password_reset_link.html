{% extends 'shop/public_base.html' %}
{% block content %}
<div class="card">
    <div class="card-header">Lien de réinitialisation</div>
    <div class="card-body">
        <p>Pour réinitialiser votre mot de passe, cliquez sur le lien ci-dessous :</p>
        <div class="alert alert-info">
            <a href="{{ reset_url }}" target="_blank">{{ reset_url }}</a>
        </div>
        <p>Ce lien vous mènera à une page où vous pourrez choisir un nouveau mot de passe.</p>
        <a href="{% url 'connexion' %}" class="btn btn-secondary">Retour à la connexion</a>
    </div>
</div>
{% endblock %}
